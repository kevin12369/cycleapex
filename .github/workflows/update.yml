name: Update Market Data

on:
  schedule:
    # 每周一至周五 21:00 UTC（美股收盘后、覆盖当日A股数据）。GitHub 采用 UTC，最小粒度 5 分钟。
    # 注意：公共仓库若 60 天无任何活动，定时任务会被自动禁用；本工作流每次都会提交数据，
    #       因此只要持续运行即可保持仓库活跃，无需额外 keep-alive。
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}   # 允许手动触发 / 通过 API 精确触发

permissions:
  contents: write        # 提交生成的 data/market.json
  actions: write         # 触发 pages.yml（见最后一步的说明）

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Fetch & compute bull/bear data
        # 全部数据源免密钥，无需配置任何 Secret（原 FRED_KEY / TUSHARE_TOKEN 已随
        # 信用、宏观两个维度一并移除，本项目不使用需要 API Key 的数据源）。
        run: python scripts/fetch_data.py

      - name: Commit updated data
        id: commit
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          git add -A data/
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 自动更新市场牛熊数据 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 必须显式触发 Pages 部署。
      # 原因：用 GITHUB_TOKEN 推送的提交**不会**触发其他 workflow（GitHub 的防递归机制），
      # 所以 pages.yml 的 on.push 收不到这次提交，线上会一直停留在上一次部署的旧数据上。
      # 2026-10-31 实测确认：update.yml 成功提交后，线上 market.json 仍是上一版（13 维口径）。
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
