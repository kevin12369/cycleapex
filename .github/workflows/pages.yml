name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site (排除 history/scripts/.github，避免发布 88MB 快照)
        run: |
          mkdir -p dist/assets dist/data
          cp index.html dist/
          [ -f report.html ] && cp report.html dist/ || true
          cp assets/app.js assets/style.css dist/assets/
          [ -f .nojekyll ] && cp .nojekyll dist/ || true
          # 前端实际只 fetch 这两个数据文件（见 assets/app.js 的 fetch 调用）
          cp data/market.json dist/data/
          cp data/paradigm.json dist/data/
          echo "=== 发布产物清单 ===" && find dist -type f | sort
          echo "=== 总体积 ===" && du -sh dist

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
